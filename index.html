                    <div className="bg-gradient-to-br from-emerald-900/90 to-teal-950 border-2 border-amber-400 rounded-2xl p-4 flex items-center gap-3.5 shadow-xl">
                      <div className="w-14 h-14 rounded-2xl bg-amber-400 text-navy-950 text-2xl flex items-center justify-center shrink-0">🎁</div>
                      <div>
                        <div className="font-display font-black text-sm uppercase text-amber-300">🎉 Lucky Draw Included!</div>
                        <div className="text-xs text-slate-200 mt-0.5">Win Exciting Prizes & Many More on Race Day!</div>
                      </div>
                    </div>
                  </div>

                  {/* Countdown */}
                  <div className="grid grid-cols-4 gap-3 sm:gap-4 max-w-lg">
                    {[
                      { label: "DAYS", value: timeLeft.days },
                      { label: "HOURS", value: timeLeft.hours },
                      { label: "MINUTES", value: timeLeft.minutes },
                      { label: "SECONDS", value: timeLeft.seconds },
                    ].map((item) => (
                      <div key={item.label} className="bg-navy-900/85 border border-white/15 rounded-2xl p-3 sm:p-4 text-center backdrop-blur-xl shadow-2xl">
                        <div className="font-athletic font-bold text-4xl sm:text-5xl text-white leading-none tabular-nums">
                          {String(item.value).padStart(2, "0")}
                        </div>
                        <div className="text-[10px] sm:text-[11px] font-display font-extrabold uppercase tracking-widest text-coral-400 mt-1">
                          {item.label}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Right 5 Cols: Poster-Styled Category Stack */}
                <div className="lg:col-span-5">
                  <div className="bg-navy-900/90 backdrop-blur-2xl border-2 border-white/20 rounded-3xl p-6 sm:p-7 shadow-2xl">
                    <div className="flex items-center justify-between mb-5">
                      <div>
                        <span className="text-[11px] font-display font-black uppercase tracking-widest text-volt">⚡ 50% OFF TILL 30-NOV-2026</span>
                        <h2 className="font-display font-black text-xl text-white uppercase">Choose Your Race Category</h2>
                      </div>
                      <span className="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-[11px] font-bold">
                        14th Feb 2027
                      </span>
                    </div>

                    <div className="space-y-3">
                      {RACE_CATEGORIES.map((cat) => {
                        const isSelected = selectedCategory.id === cat.id;
                        return (
                          <div
                            key={cat.id}
                            onClick={() => setSelectedCategory(cat)}
                            className={`cursor-pointer rounded-2xl p-4 transition-all border-2 ${
                              isSelected ? "bg-navy-950 text-white border-volt shadow-xl scale-[1.01]" : "bg-navy-950/75 text-white border-white/10 hover:border-white/30"
                            }`}
                          >
                            <div className="flex items-center justify-between gap-3">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="font-athletic font-bold text-3xl sm:text-4xl text-white leading-none">{cat.distance}</span>
                                  <span className="px-2 py-0.5 text-[9px] font-display font-black uppercase rounded bg-coral-500 text-white">50% OFF</span>
                                </div>
                                <p className="text-xs text-slate-300 mt-0.5">{cat.name} • Start: {cat.startTime}</p>
                              </div>
                              <div className="text-right shrink-0">
                                <div className="text-xs sm:text-sm font-display font-bold text-slate-400 line-through">RS. {cat.originalFee}</div>
                                <div className="font-display font-black text-xl sm:text-2xl text-emerald-400">RS. {cat.fee}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <button
                      onClick={() => handleOpenRegister(selectedCategory)}
                      className="mt-5 w-full bg-gradient-to-r from-coral-500 to-orange-600 text-white font-display font-black uppercase tracking-wider text-sm py-4 rounded-2xl shadow-glow"
                    >
                      Register {selectedCategory.distance} @ RS. {selectedCategory.fee} →
                    </button>
                    <p className="text-center text-[11px] text-slate-300 mt-3">
                      📍 Starting Point: <strong className="text-white">{START_VENUE}</strong>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* RACE CATEGORIES CARDS */}
          <section id="categories" className="py-24 bg-slate-50 asphalt-grid">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col lg:flex-row lg:items-end justify-between mb-14 gap-6">
                <div>
                  <span className="inline-block px-3.5 py-1 rounded-full bg-emerald-500/15 text-emerald-700 font-display font-extrabold text-xs uppercase tracking-widest mb-3">
                    🔥 Flat 50% Discount Applicable Till 30-Nov-2026
                  </span>
                  <h2 className="font-display font-black italic text-3xl sm:text-5xl text-navy-950 uppercase">
                    4 Race Categories — 14th Feb 2027
                  </h2>
                </div>
                <p className="text-slate-600 max-w-md text-sm sm:text-base">
                  Starting from <strong>Max Hospital, Sector 10, Dwarka, New Delhi</strong>.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-7">
                {RACE_CATEGORIES.map((cat) => (
                  <div key={cat.id} className="group bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-card flex flex-col justify-between">
                    <div>
                      <div className="relative h-48 overflow-hidden bg-navy-950">
                        <img src={cat.image} alt={cat.name} className="w-full h-full object-cover opacity-55 group-hover:scale-110 transition-transform duration-700" />
                        <div className="absolute inset-0 bg-gradient-to-t from-navy-950 via-navy-950/60 to-transparent" />
                        <div className="absolute bottom-3 left-5 text-white">
                          <div className="font-athletic font-bold text-5xl leading-none">{cat.distance}</div>
                          <h3 className="font-display font-extrabold text-base">{cat.name}</h3>
                        </div>
                      </div>
                      <div className="p-6 space-y-4">
                        <p className="text-xs sm:text-sm text-slate-600">{cat.description}</p>
                        <ul className="space-y-1.5 text-xs text-slate-700 font-medium">
                          {cat.perks.map((perk, i) => (
                            <li key={i} className="flex items-center gap-2">
                              <span className="w-4 h-4 rounded-full bg-emerald-500/15 text-emerald-600 flex items-center justify-center text-[10px] font-bold">✓</span>
                              <span>{perk}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                    <div className="p-6 pt-3 border-t border-slate-100">
                      <div className="flex items-baseline justify-between mb-4">
                        <div>
                          <span className="text-[11px] text-emerald-700 block font-bold">50% OFF Till 30-Nov-2026</span>
                          <div className="flex items-baseline gap-2">
                            <span className="font-display font-black text-3xl text-emerald-600">₹{cat.fee}</span>
                            <span className="text-sm text-slate-400 line-through font-bold">₹{cat.originalFee}</span>
                          </div>
                        </div>
                        <span className="text-[10px] font-display font-black uppercase text-white bg-emerald-600 px-2.5 py-1 rounded-lg">
                          SAVE ₹{cat.originalFee - cat.fee}
                        </span>
                      </div>
                      <button
                        onClick={() => handleOpenRegister(cat)}
                        className="w-full py-4 px-5 rounded-2xl bg-navy-950 hover:bg-coral-500 text-white font-display font-black uppercase tracking-wider text-xs transition-all"
                      >
                        Register {cat.distance} @ ₹{cat.fee} →
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* OFFICIAL KIT SECTION */}
          <section id="race-kit" className="py-24 bg-navy-950 text-white">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-8 items-center">
              <div className="lg:col-span-7">
                <img src="./assets/race-kit-2027.jpg" alt="Official Race Kit" className="rounded-3xl border border-white/15 w-full h-auto object-cover shadow-2xl" />
              </div>
              <div className="lg:col-span-5 space-y-4">
                {KIT_HOTSPOTS.map((item) => (
                  <div key={item.id} className="bg-white/5 border border-white/10 rounded-2xl p-4">
                    <h4 className="font-display font-extrabold text-sm text-white">{item.title}</h4>
                    <p className="text-xs text-slate-300 mt-1">{item.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer id="contact" className="bg-navy-950 text-slate-400 py-12 border-t-2 border-[#29ABE2]/30 text-center text-xs">
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <div>
                <strong className="text-white font-display">4th EDITION OF DWARKA HALF MARATHON — DELHI DWARKA RUN 2027</strong> • 14th Feb 2027 • Starting Point: Max Hospital, Sector 10, Dwarka, New Delhi
              </div>
              <div className="text-[#C5D887] font-semibold">
                ✉️ Official Email: <a href="mailto:padam@amigoconnect.com" className="underline">padam@amigoconnect.com</a> • 📞 Mobile: <a href="tel:+919971299631" className="underline">+91 99712 99631</a>
              </div>
            </div>
          </footer>

          {isModalOpen && (
            <RegistrationModal
              initialCategory={selectedCategory}
              onClose={() => setIsModalOpen(false)}
              onSuccessRegister={(newEntry) => setRegistrations((prev) => [newEntry, ...prev])}
            />
          )}
        </div>
      );
    }

    function RegistrationModal({ initialCategory, onClose, onSuccessRegister }) {
      const [step, setStep] = useState(1);
      const [category, setCategory] = useState(initialCategory || RACE_CATEGORIES[0]);
      const [formData, setFormData] = useState({
        fullName: "",
        email: "",
        mobile: "",
        dob: "",
        gender: "Male",
        tshirtSize: "M",
        emergencyName: "",
        emergencyPhone: "",
        medicalDeclaration: false,
      });

      const handleChange = (f, v) => setFormData((p) => ({ ...p, [f]: v }));

      return (
        <div className="fixed inset-0 z-50 bg-navy-950/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-display font-black text-lg text-navy-950 uppercase">
                Register @ 50% OFF (Valid Till 30-Nov-2026)
              </h3>
              <button onClick={onClose} className="text-slate-500 font-bold">✕</button>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {RACE_CATEGORIES.map((cat) => (
                <button
                  key={cat.id}
                  type="button"
                  onClick={() => setCategory(cat)}
                  className={`p-3 rounded-xl border text-left ${category.id === cat.id ? "border-coral-500 bg-coral-500/10" : "border-slate-200"}`}
                >
                  <div className="font-athletic font-bold text-2xl text-navy-950">{cat.distance}</div>
                  <div className="text-xs text-slate-400 line-through">₹{cat.originalFee}</div>
                  <div className="font-display font-black text-emerald-600 text-sm">₹{cat.fee}</div>
                </button>
              ))}
            </div>
            <div className="grid sm:grid-cols-2 gap-3 text-sm">
              <input placeholder="Full Name *" value={formData.fullName} onChange={(e) => handleChange("fullName", e.target.value)} className="px-3.5 py-2.5 rounded-xl border" />
              <input placeholder="Email Address *" value={formData.email} onChange={(e) => handleChange("email", e.target.value)} className="px-3.5 py-2.5 rounded-xl border" />
              <input placeholder="Mobile Number *" value={formData.mobile} onChange={(e) => handleChange("mobile", e.target.value)} className="px-3.5 py-2.5 rounded-xl border" />
              <input type="date" value={formData.dob} onChange={(e) => handleChange("dob", e.target.value)} className="px-3.5 py-2.5 rounded-xl border" />
            </div>
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-bold text-emerald-800">50% Discount Applied (Valid till 30-Nov-2026)</div>
                <div className="text-xs text-slate-500">Regular: <span className="line-through">₹{category.originalFee}</span></div>
              </div>
              <div className="font-display font-black text-2xl text-emerald-600">₹{category.fee}</div>
            </div>
            <button onClick={onClose} className="w-full bg-coral-500 text-white font-display font-black uppercase py-3.5 rounded-xl">
              Pay ₹{category.fee} & Confirm Registration
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
