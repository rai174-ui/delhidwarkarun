                          <input required type="email" placeholder="Email Address *" className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm" />
                        </div>
                        <div className="grid sm:grid-cols-2 gap-4">
                          <input required type="tel" placeholder="Mobile Number *" className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm" />
                          <select className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white">
                            <option>Individual Runner Query</option>
                            <option>Running Club / Corporate Bulk Entry (15+)</option>
                            <option>Pacemaker Application</option>
                            <option>Sponsorship & Expo Stall</option>
                          </select>
                        </div>
                        <textarea required rows="3" placeholder="Your Message *" className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm"></textarea>
                        <button type="submit" className="bg-navy-950 hover:bg-coral-500 text-white font-display font-black uppercase tracking-wider text-xs px-7 py-4 rounded-xl transition-colors">
                          Send Message →
                        </button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-navy-950 text-slate-400 py-14 border-t border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6 text-xs">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-coral-500 text-white font-athletic font-bold text-xl flex items-center justify-center pt-0.5">
                  DDR
                </div>
                <div>
                  <div className="font-display font-black text-white text-sm uppercase">DELHI DWARKA RUN 2027</div>
                  <div>Official Marathon Portal • support@delhidwarkarun.in</div>
                </div>
              </div>
              <div className="flex flex-wrap gap-5 font-semibold text-slate-300">
                <a href="#home" className="hover:text-coral-400">Home</a>
                <a href="#categories" className="hover:text-coral-400">Categories</a>
                <a href="#race-kit" className="hover:text-coral-400">Medal & Kit</a>
                <a href="#route-map" className="hover:text-coral-400">Route Map</a>
                <a href="#results" className="hover:text-coral-400">Results</a>
              </div>
              <div>© 2026–2027 Delhi Dwarka Run Secretariat. All rights reserved.</div>
            </div>
          </footer>

          {/* VIDEO MODAL */}
          {videoModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-navy-950 border border-white/20 rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl">
                <div className="flex items-center justify-between px-6 py-4 border-b border-white/10">
                  <h3 className="font-display font-bold text-white text-sm uppercase tracking-wider">
                    Delhi Dwarka Run — Official Race Highlight Reel
                  </h3>
                  <button onClick={() => setVideoModalOpen(false)} className="text-white bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg">
                    ✕
                  </button>
                </div>
                <video controls autoPlay className="w-full aspect-video bg-black">
                  <source src="./DDR%20Dwarka%20Half%20Marathon%202026.m4v" type="video/mp4" />
                </video>
              </div>
            </div>
          )}

          {/* INTERACTIVE REGISTRATION MODAL WITH LIVE BIB PREVIEW */}
          {isModalOpen && (
            <RegistrationModal
              initialCategory={selectedCategory}
              onClose={() => setIsModalOpen(false)}
              onSuccessRegister={(newEntry) => setRegistrations((prev) => [newEntry, ...prev])}
            />
          )}
        </div>
      );
    }

    function RegistrationModal({ initialCategory, onClose, onSuccessRegister }) {
      const [step, setStep] = useState(1);
      const [category, setCategory] = useState(initialCategory || RACE_CATEGORIES[1]);
      const [couponCode, setCouponCode] = useState("");
      const [discountApplied, setDiscountApplied] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState("upi");
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);
      const [confirmedBib, setConfirmedBib] = useState(null);
      const [errors, setErrors] = useState({});

      const [formData, setFormData] = useState({
        fullName: "",
        email: "",
        mobile: "",
        dob: "",
        gender: "Male",
        bloodGroup: "O+",
        tshirtSize: "M",
        emergencyName: "",
        emergencyPhone: "",
        club: "",
        medicalDeclaration: false,
      });

      const handleChange = (field, value) => {
        setFormData((prev) => ({ ...prev, [field]: value }));
        if (errors[field]) setErrors((prev) => ({ ...prev, [field]: null }));
      };

      const validateStep1 = () => {
        const newErrors = {};
        if (!formData.fullName || formData.fullName.trim().length < 3) newErrors.fullName = "Enter full name (min 3 chars).";
        if (!formData.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) newErrors.email = "Enter a valid email.";
        if (!formData.mobile || !/^[6-9]\d{9}$/.test(formData.mobile.replace(/\D/g, "").slice(-10))) newErrors.mobile = "Enter valid 10-digit mobile number.";
        if (!formData.dob) newErrors.dob = "Select Date of Birth.";
        if (!formData.emergencyName || formData.emergencyName.trim().length < 2) newErrors.emergencyName = "Emergency contact name required.";
        if (!formData.emergencyPhone || !/^[6-9]\d{9}$/.test(formData.emergencyPhone.replace(/\D/g, "").slice(-10))) newErrors.emergencyPhone = "Enter valid 10-digit emergency phone.";
        if (!formData.medicalDeclaration) newErrors.medicalDeclaration = "Please accept the medical declaration.";
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const baseFee = category.fee;
      const discountAmount = discountApplied ? Math.round(baseFee * 0.1) : 0;
      const platformFee = 29;
      const totalPayable = baseFee - discountAmount + platformFee;

      const handleSimulatedPayment = () => {
        setIsProcessingPayment(true);
        setTimeout(() => {
          const prefix = category.id === "full" ? "42" : category.id === "half" ? "21" : category.id === "10k" ? "10" : "50";
          const generatedBib = prefix + Math.floor(100 + Math.random() * 899);
          const txnId = "pay_DDR27_" + Math.random().toString(36).substring(2, 9).toUpperCase();
          const confirmedObj = {
            bib: generatedBib,
            txnId,
            name: formData.fullName,
            category: category.name,
            distance: category.distance,
            startTime: category.startTime,
            gender: formData.gender,
            tshirtSize: formData.tshirtSize,
            club: formData.club || "Delhi Dwarka Runners",
            amountPaid: totalPayable,
            netTime: "Confirmed (2027)",
            pace: "Wave A/B",
            isNew: true
          };
          setConfirmedBib(confirmedObj);
          setIsProcessingPayment(false);
          setStep(3);
          if (onSuccessRegister) onSuccessRegister(confirmedObj);
        }, 1000);
      };

      return (
        <div className="fixed inset-0 z-50 bg-navy-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-200 my-auto max-h-[92vh] flex flex-col">
            <div className="bg-navy-950 text-white px-6 py-5 flex items-center justify-between shrink-0">
              <div>
                <span className="px-2.5 py-0.5 rounded bg-coral-500 text-[10px] font-display font-black uppercase tracking-wider">
                  Delhi Dwarka Run 2027 • Step {step} of 3
                </span>
                <h3 className="font-display font-black text-lg sm:text-xl mt-1 uppercase">
                  {step === 1 && "Runner Registration & Live Bib Preview"}
                  {step === 2 && "Summary & Razorpay Secure Checkout"}
                  {step === 3 && "Official 2027 E-Bib Confirmed!"}
                </h3>
              </div>
              <button onClick={onClose} className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white">✕</button>
            </div>

            <div className="p-6 sm:p-7 overflow-y-auto space-y-5">
              {step === 1 && (
                <form onSubmit={(e) => { e.preventDefault(); if (validateStep1()) setStep(2); }} className="space-y-5" noValidate>
                  {/* Category Selector */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    {RACE_CATEGORIES.map((cat) => (
                      <button
                        type="button"
                        key={cat.id}
                        onClick={() => setCategory(cat)}
                        className={`p-3 rounded-2xl border text-left transition-all ${
                          category.id === cat.id
                            ? "border-coral-500 bg-coral-500/10 ring-2 ring-coral-500/20"
                            : "border-slate-200 bg-slate-50"
                        }`}
                      >
                        <div className="font-athletic font-bold text-2xl leading-none text-navy-950">{cat.distance}</div>
                        <div className="text-[11px] font-bold text-coral-600">₹{cat.fee}</div>
                      </button>
                    ))}
                  </div>

                  {/* Live Dynamic Bib Preview Strip */}
                  <div className="bg-gradient-to-r from-navy-950 via-navy-900 to-navy-800 rounded-2xl p-4 text-white flex items-center justify-between border border-coral-500/40">
                    <div>
                      <div className="text-[10px] font-display font-bold uppercase text-coral-400">Live 2027 Race Bib Preview</div>
                      <div className="font-display font-black text-lg uppercase tracking-wide text-white mt-0.5">
                        {formData.fullName ? formData.fullName : "YOUR NAME ON BIB"}
                      </div>
                      <div className="text-[11px] text-slate-300">
                        {category.name} • Tee Size: {formData.tshirtSize} • Blood: {formData.bloodGroup}
                      </div>
                    </div>
                    <div className="text-right bg-white text-navy-950 px-3.5 py-2 rounded-xl font-athletic font-bold text-3xl leading-none">
                      {category.distance}
                    </div>
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Full Name *</label>
                      <input type="text" value={formData.fullName} onChange={(e) => handleChange("fullName", e.target.value)} placeholder="Siddharth Kapoor" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.fullName && <p className="text-xs text-red-600 mt-1">{errors.fullName}</p>}
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Email Address *</label>
                      <input type="email" value={formData.email} onChange={(e) => handleChange("email", e.target.value)} placeholder="runner@example.com" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.email && <p className="text-xs text-red-600 mt-1">{errors.email}</p>}
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Mobile Number *</label>
                      <input type="tel" value={formData.mobile} onChange={(e) => handleChange("mobile", e.target.value)} placeholder="9876543210" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.mobile && <p className="text-xs text-red-600 mt-1">{errors.mobile}</p>}
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Date of Birth *</label>
                      <input type="date" value={formData.dob} onChange={(e) => handleChange("dob", e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.dob && <p className="text-xs text-red-600 mt-1">{errors.dob}</p>}
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Gender *</label>
                      <select value={formData.gender} onChange={(e) => handleChange("gender", e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Non-Binary / Other">Non-Binary / Other</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">T-Shirt Size *</label>
                      <select value={formData.tshirtSize} onChange={(e) => handleChange("tshirtSize", e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                        <option value="S">S (Chest 38")</option>
                        <option value="M">M (Chest 40")</option>
                        <option value="L">L (Chest 42")</option>
                        <option value="XL">XL (Chest 44")</option>
                        <option value="XXL">XXL (Chest 46")</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Emergency Contact Name *</label>
                      <input type="text" value={formData.emergencyName} onChange={(e) => handleChange("emergencyName", e.target.value)} placeholder="Emergency Contact" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.emergencyName && <p className="text-xs text-red-600 mt-1">{errors.emergencyName}</p>}
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Emergency Contact Number *</label>
                      <input type="tel" value={formData.emergencyPhone} onChange={(e) => handleChange("emergencyPhone", e.target.value)} placeholder="9811122233" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                      {errors.emergencyPhone && <p className="text-xs text-red-600 mt-1">{errors.emergencyPhone}</p>}
                    </div>
                  </div>

                  <label className="flex items-start gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-200 cursor-pointer text-xs text-slate-700">
                    <input type="checkbox" checked={formData.medicalDeclaration} onChange={(e) => handleChange("medicalDeclaration", e.target.checked)} className="mt-0.5 w-4 h-4 accent-coral-500" />
                    <span>I declare I am medically fit and trained to participate in <strong>{category.name}</strong> at Delhi Dwarka Run 2027.</span>
                  </label>
                  {errors.medicalDeclaration && <p className="text-xs text-red-600">{errors.medicalDeclaration}</p>}

                  <div className="flex justify-end gap-3">
                    <button type="button" onClick={onClose} className="px-5 py-3 rounded-xl border border-slate-300 text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" className="bg-coral-500 hover:bg-coral-600 text-white font-display font-black uppercase text-xs px-7 py-3.5 rounded-xl shadow-glow">
                      Proceed to Checkout →
                    </button>
                  </div>
                </form>
              )}

              {step === 2 && (
                <div className="space-y-5">
                  <div className="flex gap-2">
                    <input type="text" value={couponCode} onChange={(e) => setCouponCode(e.target.value)} placeholder="Promo Code (DWARKA2027)" className="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 text-sm uppercase font-mono" />
                    <button type="button" onClick={() => { if (couponCode.trim().toUpperCase() === "DWARKA2027") setDiscountApplied(true); }} className="px-5 py-2.5 rounded-xl bg-navy-950 text-white font-display font-bold text-xs uppercase">
                      {discountApplied ? "10% Applied ✓" : "Apply"}
                    </button>
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-2 text-sm">
                    <div className="flex justify-between"><span>{category.name} Fee</span><strong>₹{baseFee}</strong></div>
                    {discountApplied && <div className="flex justify-between text-emerald-600"><span>Promo (DWARKA2027)</span><span>- ₹{discountAmount}</span></div>}
                    <div className="flex justify-between text-xs text-slate-500"><span>RFID Portal Fee</span><span>₹{platformFee}</span></div>
                    <div className="border-t pt-2 flex justify-between font-display font-black text-xl text-coral-600">
                      <span>Total Payable</span><span>₹{totalPayable}</span>
                    </div>
                  </div>

                  <button
                    type="button"
                    disabled={isProcessingPayment}
                    onClick={handleSimulatedPayment}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-display font-black uppercase py-4 rounded-xl shadow-lg"
                  >
                    {isProcessingPayment ? "Confirming Bib..." : `Pay ₹${totalPayable} via Razorpay`}
                  </button>
                </div>
              )}

              {step === 3 && confirmedBib && (
                <div className="text-center space-y-5">
                  <div className="font-display font-black text-2xl text-navy-950">
                    🎉 Registration Confirmed! Bib #{confirmedBib.bib}
                  </div>
                  <div className="bg-navy-950 text-white rounded-3xl p-6 max-w-md mx-auto border-2 border-coral-500">
                    <div className="text-xs text-coral-400 font-display font-bold">DELHI DWARKA RUN 2027 • {confirmedBib.distance}</div>
                    <div className="font-athletic font-bold text-6xl text-white my-2">#{confirmedBib.bib}</div>
                    <div className="font-display font-extrabold text-base text-volt uppercase">{confirmedBib.name}</div>
                    <div className="text-xs text-slate-300 mt-2">Flag-Off: {confirmedBib.startTime} • Tee Size: {confirmedBib.tshirtSize}</div>
                  </div>
                  <button type="button" onClick={onClose} className="bg-coral-500 text-white font-display font-black uppercase text-xs px-8 py-3.5 rounded-xl">
                    Done & View Leaderboard
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
